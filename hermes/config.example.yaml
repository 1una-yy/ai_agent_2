# Example fragment for  $HERMES_HOME/config.yaml
#
# GOAL: make Hermes call the Governance Gateway as a custom OpenAI-compatible
# endpoint, WITHOUT modifying Hermes source.
#
# IMPORTANT (PLAN §A.3 R2): the Hermes quickstart configures custom endpoints
# primarily through env (`OPENAI_BASE_URL` / `OPENAI_API_KEY`, set by
# enable-routing.sh) and `hermes config set`. Treat the YAML below as a
# reference only — reconcile the exact keys with your installed version:
#
#     hermes config path        # where the real config.yaml is
#     hermes config env-path    # where the real .env is
#     hermes --help / hermes model
#
# Whatever the exact key names, the effect must be:
#   provider  = a custom / OpenAI-compatible provider
#   base_url  = http://127.0.0.1:4000/v1   (the Gateway)
#   model     = governed-model             (the single alias the Gateway exposes)
#   api_key   = the Gateway token (NOT a provider key)

model:
  provider: custom            # or "openai" pointed at a custom base_url
  model: governed-model
  base_url: http://127.0.0.1:4000/v1

# Keep the test profile locked down for the first runs (turn features on one at
# a time when you specifically want to exercise them):
terminal:
  backend: docker            # never run the raw host shell for governed tests
tools:
  delegation: true           # we WANT to exercise delegate_task -> agent.spawn
mcp:
  enabled: false
cron:
  enabled: false
memory:
  capture: false
browser:
  enabled: false

# Do NOT use --yolo / HERMES_YOLO_MODE for governed testing.
