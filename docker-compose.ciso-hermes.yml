# Override for:  dciso up-ollama --ciso hermes
#
# In this mode the AI CISO is NOT the small containerised rule/LLM service.
# It is a separate, tool-less Hermes instance (its own HERMES_HOME, its own
# model straight to Ollama — never through this gateway) invoked by an advisor
# sidecar running on the HOST at 127.0.0.1:9009.
#
# This file therefore:
#   * stops the containerised `ciso-advisor` from starting (profile never enabled)
#   * repoints gateway + pep at the host sidecar via host.docker.internal:9009
#   * drops their `depends_on: ciso-advisor` (needs Compose v2.24+ for !override)
#
# Bring the stack up with BOTH files (dciso does this for you):
#   docker compose -f docker-compose.yml -f docker-compose.ciso-hermes.yml up -d

services:
  ciso-advisor:
    profiles: ["disabled-when-ciso-is-hermes"]

  gateway:
    depends_on: !override
      opa:
        condition: service_healthy
    environment:
      CISO_ADVISOR_URL: http://host.docker.internal:9009

  pep:
    depends_on: !override
      opa:
        condition: service_healthy
    environment:
      CISO_ADVISOR_URL: http://host.docker.internal:9009
